<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Loopt - Watch Loop</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #000000;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: #121212;
      border: 1px solid rgba(255, 159, 10, 0.25);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 159, 10, 0.12);
    }
    .logo-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
    }
    .logo-img {
      width: 76px;
      height: 76px;
      border-radius: 19px;
      box-shadow: 0 6px 16px rgba(255, 159, 10, 0.35);
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    h1 span {
      color: #FF9F0A;
    }
    p.subtitle {
      font-size: 14px;
      color: #A0A0A0;
      margin-bottom: 24px;
      line-height: 1.45;
    }
    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #FF9F0A;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 16px;
      margin-bottom: 12px;
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }
    .btn-main:active {
      transform: scale(0.98);
      background: #E08B07;
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 16px;
      transition: transform 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }
    .btn-secondary:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.14);
    }
    .status-text {
      margin-top: 18px;
      font-size: 12px;
      color: #666666;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img class="logo-img" src="https://raw.githubusercontent.com/ianconnell128-hue/loopt/main/assets/icon.png" alt="Loopt Logo">
    </div>
    <h1>Watch on <span>Loopt</span></h1>
    <p class="subtitle" id="subText">Opening the shared video in your Loopt app... If you don't have Loopt installed yet, download the APK below!</p>

    <a id="openAppBtn" class="btn-main" href="#">
      <span>▶ Open in Loopt</span>
    </a>

    <a id="downloadApkBtn" class="btn-secondary" href="https://github.com/ianconnell128-hue/loopt/releases/latest/download/Loopt.apk">
      <span>⬇ Download & Install APK</span>
    </a>

    <div class="status-text" id="statusText">Attempting to open Loopt...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('video') || '';
    const apkUrl = "https://github.com/ianconnell128-hue/loopt/releases/latest/download/Loopt.apk";
    const appDeepLink = videoId ? ("loopt://video/" + encodeURIComponent(videoId)) : "loopt://";

    document.getElementById('openAppBtn').href = appDeepLink;
    document.getElementById('downloadApkBtn').href = apkUrl;

    if (videoId) {
      document.getElementById('subText').innerText = "Opening loop #" + videoId + " in Loopt... If Loopt is not installed, download the APK below to watch!";
    }

    // Attempt to automatically open the app via custom deep link
    let appOpened = false;
    window.addEventListener('blur', function() {
      appOpened = true;
    });

    if (videoId) {
      // Fire intent/deep-link redirect
      window.location.href = appDeepLink;

      // If user is still here after 1.8 seconds, advise them to download the APK
      setTimeout(function() {
        if (!appOpened && !document.hidden) {
          document.getElementById('statusText').innerText = "Loopt not installed? Click 'Download & Install APK' to get started.";
        }
      }, 1800);
    }
  </script>
</body>
</html>
